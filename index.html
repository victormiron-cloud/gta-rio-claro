<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GTA Rio Claro</title><style>body{margin:0;background:#9bd0f4;overflow:hidden;font-family:Arial;color:white}canvas{display:block}#hud{position:absolute;inset:0;pointer-events:none}#name,#tips,#info{position:absolute;background:#0a1928cc;padding:13px;border-radius:9px}#name{top:15px;left:15px;font-size:24px;font-weight:900}b{color:#ffc862}#tips{top:77px;left:15px;font-size:13px;line-height:1.7}#info{right:15px;top:15px}#gate{position:absolute;inset:0;background:#0a1a2adf;display:flex;align-items:center;justify-content:center}#gate article{width:min(550px,90vw)}h1{font-size:64px;margin:0}button{background:#ffc862;border:0;border-radius:9px;padding:15px 24px;font-weight:900;cursor:pointer}#mobile{display:none;position:absolute;bottom:20px;left:12px;pointer-events:auto;gap:5px}#mobile button{padding:13px;touch-action:none}@media(max-width:700px){#tips{display:none}#mobile{display:flex}#name{font-size:16px}#info{font-size:12px}}</style><canvas id="game"></canvas><div id="hud"><div id="name">GTA <b>RIO CLARO</b></div><div id="tips">WASD / SETAS — ANDAR E DIRIGIR<br>E — ENTRAR OU SAIR DO CARRO<br>SHIFT — CORRER · ESPAÇO — FREAR<br>R — REINICIAR</div><div id="info">CENTRO DE RIO CLARO, SP<br><span id="status">🚶 A PÉ</span></div><div id="mobile"><button data-k="a">◀</button><button data-k="w">▲</button><button data-k="s">▼</button><button data-k="d">▶</button><button id="enter">CARRO</button></div></div><div id="gate"><article><h1>GTA<br><b>RIO CLARO</b></h1><p>Explore um centro de Rio Claro estilizado em 3D, com carros brasileiros, ruas, praças e fachadas.</p><button id="play">▶ JOGAR AGORA</button></article></div><script>
const canvas=document.getElementById('game'),c=canvas.getContext('2d');let W,H,keys={},on=false,inCar=false,car={x:8,z:-15,a:0},p={x:16,z:-15},a=0,vel=0;
function size(){W=canvas.width=innerWidth;H=canvas.height=innerHeight}size();onresize=size;onkeydown=e=>{let k=e.key.toLowerCase();keys[k]=1;if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();if(k==='e'&&!e.repeat)enter();if(k==='r'){p={x:16,z:-15};car={x:8,z:-15,a:0};inCar=false}};onkeyup=e=>keys[e.key.toLowerCase()]=0;for(let b of document.querySelectorAll('[data-k]')){b.onpointerdown=e=>{keys[b.dataset.k]=1;b.setPointerCapture(e.pointerId)};b.onpointerup=b.onpointercancel=()=>keys[b.dataset.k]=0}document.getElementById('enter').onclick=enter;document.getElementById('play').onclick=()=>{on=true;document.getElementById('gate').style.display='none'};function enter(){if(inCar){inCar=false;p={x:car.x+5,z:car.z}}else if(Math.hypot(p.x-car.x,p.z-car.z)<17)inCar=true;document.getElementById('status').textContent=inCar?'🚗 DIRIGINDO':'🚶 A PÉ'}
function poly(points,color){c.fillStyle=color;c.beginPath();points.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.closePath();c.fill()}function draw(){requestAnimationFrame(draw);if(!on)return;let f=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0),t=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);if(inCar){vel+=(f*1.7-vel)*.04;if(keys[' '])vel*=.88;car.a+=t*.034*(vel>=0?1:-1);car.x+=Math.sin(car.a)*vel;car.z-=Math.cos(car.a)*vel}else{p.x+=t*(keys.shift?1.5:.7);p.z-=f*(keys.shift?1.5:.7)}let pos=inCar?car:p;pos.x=Math.max(-290,Math.min(290,pos.x));pos.z=Math.max(-290,Math.min(290,pos.z));c.clearRect(0,0,W,H);const h=H*.42;let sky=c.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#79b4db');sky.addColorStop(1,'#dce9d7');c.fillStyle=sky;c.fillRect(0,0,W,h);c.fillStyle='#5d8267';c.fillRect(0,h,W,H-h);
const camA=inCar?car.a:0,co=Math.cos(camA),si=Math.sin(camA);function project(x,y,z){let dx=x-pos.x,dz=z-pos.z;let X=dx*co+dz*si,Z=-dx*si+dz*co+20;if(Z<2)return null;let scale=600/Z;return [W/2+X*scale,h+(3-y)*scale,scale,Z]}const drawables=[];function face(pts,color){let pp=pts.map(q=>project(...q));if(pp.some(q=>!q))return;drawables.push({z:pp.reduce((a,b)=>a+b[3],0)/pp.length,pts:pp.map(q=>[q[0],q[1]]),color})}
function block(x,z,w,d,ht,color){let v=[[x-w/2,z-d/2],[x+w/2,z-d/2],[x+w/2,z+d/2],[x-w/2,z+d/2]];face([[v[0][0],ht,v[0][1]],[v[1][0],ht,v[1][1]],[v[2][0],ht,v[2][1]],[v[3][0],ht,v[3][1]]],color);face([[v[0][0],0,v[0][1]],[v[1][0],0,v[1][1]],[v[1][0],ht,v[1][1]],[v[0][0],ht,v[0][1]]],color);face([[v[1][0],0,v[1][1]],[v[2][0],0,v[2][1]],[v[2][0],ht,v[2][1]],[v[1][0],ht,v[1][1]]],color)}
for(let i=-4;i<=4;i++)for(let j=-4;j<=4;j++){let x=i*70,z=j*70;face([[x-9,0,z-9],[x+9,0,z-9],[x+9,0,z+9],[x-9,0,z+9]],'#454b52');face([[-290,0,z-8],[290,0,z-8],[290,0,z+8],[-290,0,z+8]],'#454b52');face([[x-8,0,-290],[x+8,0,-290],[x+8,0,290],[x-8,0,290]],'#454b52')}
for(let i=-4;i<4;i++)for(let j=-4;j<4;j++){let x=(i+.5)*70,z=(j+.5)*70;if(Math.abs(x-pos.x)>240||Math.abs(z-pos.z)>240)continue;let park=(i===0&&j===0)||(i===1&&j===1),station=(i===-3&&j===0),market=(i===2&&j===-1);if(park){face([[x-27,0,z-27],[x+27,0,z-27],[x+27,0,z+27],[x-27,0,z+27]],'#467a4d');for(let k=0;k<8;k++){let tx=x+Math.cos(k*2.4)*19,tz=z+Math.sin(k*2.4)*19;block(tx,tz,2,2,10,'#65503e');block(tx,tz,10,10,17,'#286a37')}}else if(station){block(x,z,52,28,14,'#d5b89c');block(x+19,z-5,8,9,25,'#e5cfb1')}else if(market){block(x,z,54,48,13,'#d7c5ab')}else {block(x-13,z,23,28,11+((i*j+27)%5)*3,['#ceb69e','#aeb9b7','#d8c3aa'][Math.abs(i+j)%3]);block(x+13,z,22,26,9+((i*5+j+31)%4)*4,'#c1b4a3')}}function vehicle(x,z){block(x,z,5,9,2,'#d43e34');block(x,z-1,4,5,3.6,'#304e5e')}vehicle(car.x,car.z);drawables.sort((u,v)=>v.z-u.z);for(let item of drawables)poly(item.pts,item.color);
if(!inCar){let sx=W/2,sy=H*.75;c.fillStyle='#213449';c.fillRect(sx-7,sy-37,14,24);c.fillRect(sx-6,sy-13,5,18);c.fillRect(sx+2,sy-13,5,18);c.fillStyle='#c49072';c.beginPath();c.arc(sx,sy-45,9,0,7);c.fill()}c.fillStyle='#fff';c.font='bold 13px Arial';c.fillText(inCar?'DIRIGINDO CARRO BRASILEIRO':'CAMINHANDO PELO CENTRO',22,H-25)}requestAnimationFrame(draw);
</script></html>
